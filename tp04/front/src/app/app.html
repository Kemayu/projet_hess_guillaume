<main class="page-shell">
  <header class="hero">
    <a routerLink="/" class="brand">Sentinelle Pollution</a>
    <p class="intro">Déclarez, consultez et suivez les pollutions observées.</p>
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Pollutions</a>
      <a routerLink="/users" routerLinkActive="active">Utilisateurs</a>
      <span class="nav-spacer"></span>
      @if (auth.currentUser(); as user) {
        <span class="nav-user">Bonjour {{ user.firstName }}</span>
        <button type="button" class="nav-logout" (click)="auth.logout()">Déconnexion</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Connexion</a>
      }
    </nav>
  </header>
  <router-outlet></router-outlet>
</main>
