<main class="page">
  <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)" class="form-card" novalidate>
    <h1>Inscription</h1>

    <div class="form-grid">
      <div class="field">
        <label for="login">Login</label>
        <input id="login" name="login" type="text" [(ngModel)]="user.login" #login="ngModel" required />
        <small *ngIf="login.invalid && (login.touched || submitted)">Le login est requis.</small>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" [(ngModel)]="user.password" #password="ngModel" required />
        <small *ngIf="password.invalid && (password.touched || submitted)">Le mot de passe est requis.</small>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmation du mot de passe</label>
        <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="user.confirmPassword" #confirmPassword="ngModel" required />
        <small *ngIf="confirmPassword.invalid && (confirmPassword.touched || submitted)">La confirmation du mot de passe est requise.</small>
        <small *ngIf="!confirmPassword.invalid && passwordMismatch && (confirmPassword.touched || submitted)">Les mots de passe doivent être identiques.</small>
      </div>

      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" name="nom" type="text" [(ngModel)]="user.nom" #nom="ngModel" required />
        <small *ngIf="nom.invalid && (nom.touched || submitted)">Le nom est requis.</small>
      </div>

      <div class="field">
        <label for="prenom">Prénom</label>
        <input id="prenom" name="prenom" type="text" [(ngModel)]="user.prenom" #prenom="ngModel" required />
        <small *ngIf="prenom.invalid && (prenom.touched || submitted)">Le prénom est requis.</small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="user.email" #email="ngModel" required email />
        <small *ngIf="email.invalid && (email.touched || submitted)">Un email valide est requis.</small>
      </div>
    </div>

    <button type="submit" class="submit-btn">S'inscrire</button>
  </form>
</main>
