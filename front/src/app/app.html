<main class="page-shell">
  <header class="hero">
    <a routerLink="/pollutions" class="brand">Sentinelle Pollution</a>
    <p class="intro">Déclarez, consultez et suivez les pollutions observées.</p>
    <nav class="main-nav">
      <a routerLink="/pollutions" routerLinkActive="active">Pollutions</a>
      @if (isLoggedIn()) {
        <a routerLink="/users" routerLinkActive="active">Utilisateurs</a>
      }
      <span class="nav-spacer"></span>
      @if (isLoggedIn()) {
        <span class="nav-user">Bonjour {{ username() }}</span>
        <button type="button" class="nav-logout" (click)="logout()">Déconnexion</button>
      } @else {
        <a routerLink="/auth/login" routerLinkActive="active">Connexion</a>
        <a routerLink="/auth/register" routerLinkActive="active">Inscription</a>
      }
    </nav>
  </header>
  <router-outlet></router-outlet>
</main>
