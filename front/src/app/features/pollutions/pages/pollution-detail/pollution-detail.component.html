<section class="detail-page">
  <a routerLink="/pollutions" class="back-link">← Retour à la liste</a>

  @if (pollution(); as current) {
    <app-pollution-recap [declaration]="current"></app-pollution-recap>

    @if (auth.isLoggedIn()) {
      @if (message()) { <p class="message" role="status">{{ message() }}</p> }
      <app-pollution-form
        [initialValue]="current"
        title="Modifier la déclaration"
        submitLabel="Enregistrer"
        [resetAfterSubmit]="false"
        (submitted)="update($event)"
      ></app-pollution-form>
    } @else {
      <p class="login-hint">
        <a routerLink="/auth/login" [queryParams]="{ returnUrl: currentUrl }">Connectez-vous</a>
        pour modifier ce signalement.
      </p>
    }
  } @else if (notFound()) {
    <p class="message error">Ce signalement est introuvable.</p>
  } @else {
    <p>Chargement du signalement...</p>
  }
</section>
